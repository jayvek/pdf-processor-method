[project]
name = "pdf-processor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jay", email = "jaypatelll573@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pypdf>=6.17.0",
    "tabula-py>=2.9.0",
    "python-multipart>=0.0.32",
    "uuid>=1.30",
    "uvicorn>=0.52.4",
    "pymupdf>=1.28.2",
    "cryptography>=50.0.1",
    "camelot-py>=2.0.0",
]

[project.scripts]
pdf-processor = "pdf_processor:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

